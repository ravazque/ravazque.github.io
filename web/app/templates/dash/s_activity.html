<section id="activity">
  <h2>{{ s.title }}</h2>
  <div class="cols" data-grid>
    <div class="block" data-panel="achievements"><h3>{{ t("extras.achievements_title") }}</h3><ul class="list">{{ s.achievements }}</ul></div>
    <div class="block" data-panel="events"><h3>{{ t("extras.events_title") }}</h3><p class="note">{{ s.event_kinds }}</p><ul class="list">{{ s.events }}</ul></div>
    <div class="block" data-panel="misc"><h3>{{ t("extras.misc_title") }}</h3><ul class="list">{{ s.misc }}</ul></div>
  </div>
</section>
