# make dev: the last report saved by make build (web/preview/data.json) is served at once, and "Dev · <login>" on the
# landing signs in as its owner; the synthetic test profiles beside it (test-*.json) as "Test · <login>". Its own
# project (ravazque-info-dev), so it runs beside make production; only it publishes ports on the host.
# A change to the code needs make dev again (it rebuilds the image).
services:
  caddy:
    ports: ["80:80", "443:443"]
  api:
    environment:
      DEV_REPORT: /preview/data.json
      BASE_URL: https://localhost
      OAUTH_APP: "2"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes: ["./web/preview:/preview:ro", "consent:/data"]
