<!doctype html>
<html lang="en" data-look="paper" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raúl Vázquez Pérez · Data Engineer & Software Developer</title>

<body data-page="cv">
<header class="cv-head">
  <div class="cv-band">
    <nav class="seg-links" id="links" aria-label="Links"><a class="keep" href="ravazque/" data-t="progress42">42 Status</a></nav>
    <div class="controls-band">
      <div class="seg-band" role="group" aria-label="Language" id="langToggle"><button type="button" data-v="en">EN</button><button type="button" data-v="es">ES</button></div>
    </div>
  </div>
  <div class="cv-hero">
    <h1 class="name" id="name">Raúl Vázquez Pérez</h1>
    <p class="headline" id="headline">Data Engineer &amp; Software Developer</p>
  </div>
</header>

<main>
  <section id="about" aria-labelledby="h-about">
    <h2 id="h-about" data-t="about">About</h2>
    <p class="lead" id="lead"></p>
    <div class="island now" id="now">
      <h3 data-t="now">Right now</h3>
      <p id="nowText"></p>
    </div>
  </section>

  <section id="experience" aria-labelledby="h-exp">
    <h2 id="h-exp" data-t="experience">Experience</h2>

  <section id="highlights" aria-labelledby="h-high">

  <section id="education" aria-labelledby="h-edu">
    <h2 id="h-edu" data-t="education">Education</h2>
    <div class="entries" id="educationList"></div>
  </section>

  <section id="more" class="two-cols">
    <div>
      <h2 data-t="languages">Languages</h2>
      <ul class="languages" id="languageList"></ul>
    </div>
    <div>
      <h2 data-t="stack">Stack</h2>
      <dl class="stack" id="stackList"></dl>
    </div>
  </section>

  <footer class="updated" id="updated"></footer>
</main>
<script src="shared/accent.js"></script>
<script src="shared/controls.js"></script>
<script src="assets/site.js"></script>
