# Tests, dependency audit, secret scan and image build on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - run: go vet ./...
      - name: Tests (race detector on)
        run: go test -race ./...
      - name: Known vulnerabilities in the Go code and its standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Browser app
        working-directory: web
        run: npm ci --no-audit --no-fund && npx vue-tsc --noEmit && npx vitest run && npm run build
      - name: Known vulnerabilities in the browser app's dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: The site's scripts
        run: node --test site/tests/*.test.mjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t ravazque-info:ci .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner /repo
      - name: Files that must never be tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|(^|/)report-tool/|^\.claude/|^\.development/|(^|/)web/certs/.+\.(pem|key)$|(^|/)web/preview/|^\.v1_old/\.golden/|(^|/)node_modules/|^server/internal/web/dist/' \
            | grep -vE '(^|/)\.env\.example$|^server/internal/web/dist/\.gitkeep$' || true)
          if [ -n "$bad" ]; then echo "Tracked files that must stay local:"; echo "$bad"; exit 1; fi
