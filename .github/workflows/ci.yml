# Tests, dependency audit, secret scan and image build on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -r web/requirements.txt -e core pip-audit==2.10.1
      - name: Web tests
        working-directory: web
        run: python -m pytest -q -p no:cacheprovider
      - name: Core tests
        run: python -m pytest -q -p no:cacheprovider -o asyncio_default_fixture_loop_scope=function core/tests
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r web/requirements.txt

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test web/tests/js/*.test.mjs core/tests/js/*.test.mjs site/tests/*.test.mjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f web/Dockerfile -t web:ci .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
      - name: Files that must never be tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^report-tool/|^\.claude/|^\.development/|^web/certs/.+\.(pem|key)$|^web/preview/' || true)
          if [ -n "$bad" ]; then echo "Tracked files that must stay local:"; echo "$bad"; exit 1; fi
