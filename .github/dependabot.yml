version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: gomod
    directory: /server
    schedule: {interval: weekly}
    groups: {go: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups: {npm: {patterns: ["*"]}}
    # vue-tsc does not run on TypeScript 7 yet: lift this once it does
    ignore: [{dependency-name: typescript, versions: [">=6"]}]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
