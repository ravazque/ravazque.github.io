<div class="boot-panel" id="boot" aria-live="polite"{% if boot.view != "error" %} hx-get="/app/boot" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  <h2>{{ t("boot.title") }}</h2>
  {% if boot.view == "error" %}
    <p>{{ t("boot.failed") }}</p>
    <form method="post" action="/app/refresh"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="/app">
      <button class="btn primary" type="submit">{{ t("boot.retry") }}</button></form>
  {% elif boot.view == "wait" %}
    <p>{{ boot.wait }}</p><p class="note">{{ t("boot.wait_note") }}</p>
  {% else %}
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ boot.pct }}"><i style="width:{{ boot.pct }}%"></i></div>
    <p>{{ boot.message }}</p><p class="note">{{ t("boot.first") }}</p>
  {% endif %}
</div>
