<section id="over-time">
  <div class="panel-head"><h2>{{ s.title }}</h2>{{ s.switch }}</div>
  <p class="lede">{{ s.lede }}</p>
  <div class="cols" data-grid>
    <div class="block" data-panel="recv-monthly"><h3>{{ s.monthly_title }}</h3>{{ s.flags }}{{ s.monthly }}</div>
    <div class="block" data-panel="marks"><h3>{{ t("received.marks_title") }}</h3>{{ s.roles }}{{ s.marks }}</div>
    <div class="block" data-panel="cum-evals"><h3>{{ t("received.cum_title") }}</h3>{{ s.roles }}{{ s.cum }}</div>
    <div class="block" data-panel="cum-out"><h3>{{ t("received.cum_out_title") }}</h3>{{ s.roles }}{{ s.cum_out }}</div>
  </div>
</section>
