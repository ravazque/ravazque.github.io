<section id="home-kpis" class="modules-wrap">
  <h2 class="visually-hidden">{{ s.title }}</h2>
  <div class="modules">
    {% for x in s.modules %}<article class="module{{ ' live' if x.live }}" data-module="{{ x.key }}">
      <h3 class="tab">{{ x.label }}{% if x.aside %}<span>{{ x.aside }}</span>{% endif %}</h3>
      <p class="figure">{{ x.value }}</p>
      {% if x.meter %}{{ x.meter }}{% endif %}{% if x.chip %}<p class="chip-live">{{ x.chip }}</p>{% endif %}
      {% for l in x.lines %}<p class="line">{{ l }}</p>{% endfor %}
      {{ x.trend }}
    </article>{% endfor %}
  </div>
</section>
