name: ravazque-info

# Run through the root Makefile (make dev / make up). Every service reads the one root .env.
# No database: sessions, report copies and limits live in the api's memory; the only file it writes is the
# consent log in the consent volume.
services:
  caddy:
    image: caddy:2.11
    ports: ["80:80", "443:443"]
    volumes:
      - ./web/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./web/certs:/certs:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: web/Dockerfile}
    env_file:
      - path: .env
        required: false  # make clean / down / logs work before .env exists; make dev creates it first
    environment:
      CONSENT_LOG: /data/consent.log
    volumes: ["./core:/srv/core:ro", "consent:/data"]
    restart: unless-stopped
  # make tunnel: a free Cloudflare quick tunnel to Caddy's internal port for testers (random *.trycloudflare.com URL,
  # new on every start). Only with the profile, so make up / make dev never start it.
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:8080"]
    depends_on: [caddy]
    restart: "no"

volumes:
  caddy_data: {}
  consent: {}
