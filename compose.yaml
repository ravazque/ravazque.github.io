name: ravazque-info

# Run through the root Makefile. This file alone is production (make production: https://ravazque.info through the tunnel,
# signs in with FT_UID); with compose.dev.yaml it is make dev, a separate project on https://localhost that signs in with
# FT_UID_2. Both can run at once. Every service reads the one root .env.
# No database: sessions, report copies and limits live in the api's memory; the only file it writes is the
# consent log in the consent volume.
services:
  caddy:
    image: caddy:2.11@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    volumes:
      - ./web/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./web/certs:/certs:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: Dockerfile}
    env_file:
      - path: .env
        required: false  # make clean / down / logs work before .env exists; make dev creates it first
    environment:
      CONSENT_LOG: /data/consent.log
      BASE_URL: https://ravazque.info
      OAUTH_APP: "1"
      GITHUB_TOKEN: ""  # production never publishes: the token only reaches make dev
    volumes: ["consent:/data"]
    restart: unless-stopped
  # make production: the named Cloudflare tunnel that serves ravazque.info; its public hostname (ravazque.info ->
  # http://caddy:8080) is set in Cloudflare's dashboard. Only with the profile, so make dev never starts it.
  tunnel:
    image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [caddy]
    restart: "no"

volumes:
  caddy_data: {}
  consent: {}
