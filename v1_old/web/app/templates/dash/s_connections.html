<section id="connections">
  <div class="panel-head"><h2>{{ s.title }} {{ m.info(t("stats.group_note")) }}</h2>{% for sw in s.switches %}{{ sw }}{% endfor %}</div>
  <p class="lede">{{ s.lede }}</p>
  <div class="cols" data-grid><div class="block graph-panel" data-panel="connections">
    {{ s.legend }}
    {% if s.wide %}<div class="graph-wide">{{ s.wide }}</div><div class="graph-narrow">{{ s.narrow }}</div>
    {% else %}<p class="note">{{ s.empty }}</p>{% endif %}
  </div></div>
</section>
